name: Sync Project Status and Labels
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Get app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}

      - name: Sync labels with project
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          USERNAME: ${{ vars.USERNAME }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          MAP: |
            {
              "Triage": "status::triage",
              "Needs Info": "status::needs-info",
              "Backlog": "status::backlog",
              "Investigating": "status::investigating",
              "In Progress": "status::in-progress",
              "Review": "status::review",
              "Testing": "status::testing",
              "Resolved": "status::resolved",
              "Released": "status::released",
              "Won't Fix": "status::wont-fix",
              "Duplicate": "status::duplicate"
            }
        run: |
          set -euo pipefail

          # Fetch project items
          gh api graphql -f query='
            query($user:String!, $number:Int!) {
              user(login:$user) {
                projectV2(number:$number) {
                  items(first:100) {
                    nodes {
                      content {
                        ... on Issue {
                          id
                          number
                          repository { nameWithOwner }
                          labels(first:20){ nodes { name } }
                        }
                      }
                      fieldValues(first:20){
                        nodes {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            field { name }
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -F user=$USERNAME -F number=$PROJECT_NUMBER > data.json

          echo "$MAP" > map.json

          jq -c '.data.user.projectV2.items.nodes[] | select(.content != null)' data.json |
          while read -r item; do
            repo=$(echo "$item" | jq -r '.content.repository.nameWithOwner')
            issue=$(echo "$item" | jq -r '.content.number')
            labels=$(echo "$item" | jq -r '.content.labels.nodes[].name')
            status=$(echo "$item" | jq -r '.fieldValues.nodes[] | select(.field.name=="Status") | .name')

            want=$(jq -r --arg s "$status" '.[$s] // empty' map.json)
            [ -z "$want" ] && continue

            # Add wanted label if missing
            if ! grep -q "^$want$" <<< "$labels"; then
              gh api repos/$repo/issues/$issue/labels -f labels[]="$want" >/dev/null
            fi

            # Remove other status:: labels
            for l in $labels; do
              if [[ "$l" == status::* && "$l" != "$want" ]]; then
                gh api -X DELETE repos/$repo/issues/$issue/labels/"$l" >/dev/null || true
              fi
            done
          done
