name: New issues automation
on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Get app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}

      - name: Add status::triage label
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api repos/${{ github.repository }}/issues/$ISSUE/labels \
            -f labels[]="status::triage"

      - name: Add to project
        uses: actions/add-to-project@latest
        with:
          project-url: https://github.com/users/${{ vars.USERNAME }}/projects/${{ vars.PROJECT_NUMBER }}
          github-token: ${{ steps.app.outputs.token }}
