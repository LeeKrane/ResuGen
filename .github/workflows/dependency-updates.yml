name: Dependency Updates & Security

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  dependency-updates:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update dependencies
        run: |
          # Update patch and minor versions
          pnpm update
          
          # Check for major version updates
          pnpm outdated > outdated.txt || true
          
          if [ -s outdated.txt ]; then
            echo "Major version updates available:"
            cat outdated.txt
          fi

      - name: Run tests after updates
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run test

      - name: Check for security vulnerabilities
        run: |
          pnpm audit --audit-level moderate
          
          # Generate security report
          pnpm audit --json > security-audit.json || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'chore: automated dependency updates'
          body: |
            ## Automated Dependency Updates
            
            This PR contains automated dependency updates.
            
            ### Changes
            - Updated patch and minor versions
            - Security vulnerabilities addressed (if any)
            
            ### Testing
            - ✅ Linting passed
            - ✅ Type checking passed  
            - ✅ Unit tests passed
            
            ### Security Audit
            Please review the security audit results in the workflow logs.
            
            ---
            *This PR was created automatically by the dependency update workflow.*
          branch: chore/dependency-updates
          delete-branch: true

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium

      - name: Run npm audit
        run: |
          pnpm audit --audit-level moderate --json > npm-audit.json || true
          
          # Check if there are any vulnerabilities
          if [ -s npm-audit.json ]; then
            echo "Security vulnerabilities found!"
            cat npm-audit.json
          else
            echo "No security vulnerabilities found."
          fi

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            npm-audit.json
            snyk-report.json
          retention-days: 30

      - name: Create security issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔒 Security vulnerabilities detected';
            const body = `
            ## Security Vulnerabilities Detected
            
            The automated security scan has detected vulnerabilities in the project dependencies.
            
            ### Action Required
            - Review the security reports in the workflow artifacts
            - Update vulnerable dependencies
            - Test the application after updates
            
            ### Workflow Run
            [View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            
            ---
            *This issue was created automatically by the security scan workflow.*
            `;
            
            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security'
            });
            
            const existingIssue = issues.data.find(issue => issue.title === title);
            
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'automated']
              });
            }

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install license checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          license-checker --json > licenses.json
          license-checker --summary > license-summary.txt
          
          # Check for problematic licenses
          PROBLEMATIC_LICENSES="GPL-2.0,GPL-3.0,AGPL-1.0,AGPL-3.0"
          
          if license-checker --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Unlicense" --summary; then
            echo "✅ All licenses are compliant"
          else
            echo "❌ Some licenses may not be compliant"
            exit 1
          fi

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: |
            licenses.json
            license-summary.txt
          retention-days: 90