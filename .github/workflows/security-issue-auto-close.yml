name: Security Issue Auto-Close

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-close-security-issues:
    if: github.event.label.name == 'auto-close'
    runs-on: ubuntu-latest
    steps:
      - name: Close labeled security issue
        uses: tiangolo/issue-manager@0.5.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: >
            {
              "auto-close": {
                "delay": 60,
                "message": "## 🔒 Issue Auto-Closed\nThis issue has been automatically closed, because it was labeled with `auto-close`.\n\n**Please note:** For actual security vulnerabilities, always report via email to security+resugen@krane.dev\n\n*This action was performed automatically by the Security-Issue-Auto-Close workflow.*",
                "remove_label_on_comment": true,
                "remove_label_on_close": true
              }
            }
